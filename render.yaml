# Come questa app sta su Render.
#
# IL NOME E' L'INDIRIZZO. `quadra-moduli-prova` diventa
# quadra-moduli-prova.onrender.com, che e' pubblico anche quando l'app e'
# chiusa a chiave: chi legge l'indirizzo sa gia' qualcosa. Per questo non
# porta il nome del cliente - quello si legge dentro, dopo il codice di
# accesso, e li' lo vede solo chi e' entrato.
#
# IL PIANO. `free`, deciso da chi paga: in prova non si spende. Va detto
# che cosa si accetta, perche' non sono difetti nascosti ma due conseguenze
# precise.
#
# La memoria NON e' fra queste: il piano gratuito da' 512 MB, esattamente
# come starter, e la misura dentro un contenitore limitato a 512 MB dice
# 339 MB di picco facendo tutto - leggere il modulo piu' grosso, scrivere,
# rendere il PDF, disegnare l'anteprima. Ci sta.
#
# Le due conseguenze sono:
#
#   SI ADDORMENTA dopo un quarto d'ora e ci mette quasi un minuto a
#   svegliarsi. Chi apre il link fra una telefonata e l'altra vede una
#   pagina che non risponde.
#
#   NIENTE DISCO: sul piano gratuito Render non lo permette. Ogni riavvio
#   riporta l'istanza com'era, quindi l'anagrafica caricata sparisce e va
#   ricaricata. Per questo l'app lo dice in chiaro e permette di
#   riscaricare il fascicolo: cosi' rimetterlo e' questione di secondi.
#
# Per togliere tutte e due: `plan: starter` e il blocco `disk` qui sotto,
# commentato. Sono circa $7,25 al mese.
#
#    disk:
#      name: dati
#      mountPath: /app/dati
#      sizeGB: 1
services:
  - type: web
    name: quadra-moduli-prova
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt          # i dati sono di un'impresa italiana
    healthCheckPath: /_stcore/health
    envVars:
      # Modello comune per PDF e Word, dal confronto del 28/10/2026.
      # Una chiave OpenRouter generata apposta per questo servizio:
      # cosi' si puo' revocare senza toccare il lavoro locale, e si vede
      # quanto consuma questa prova separata dal resto.
      - key: QUADRA_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: QUADRA_MODELLO
        value: google/gemini-3.8-flash
      - key: QUADRA_TETTO_GETTONI
        value: "32768"         # limite compatibile con Gemini, verificato nel confronto
      - key: QUADRA_CHIAVE
        sync: false            # si scrive nel pannello, mai nel repository
      # Override Word mantenuto per compatibilita', ora uguale al modello
      # comune. Entrambe le chiavi puntano alla stessa credenziale OpenRouter.
      # Senza override Word si usa direttamente la configurazione comune.
      - key: QUADRA_WORD_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: QUADRA_WORD_MODELLO
        value: google/gemini-3.8-flash
      - key: QUADRA_WORD_CHIAVE
        sync: false            # una chiave OpenRouter nuova, solo per questo servizio
      # Compilazione "esperta" dei Word (compilatore_esperto.py): il modello
      # vede i valori dell'anagrafica, compone, giustifica con le fonti e
      # rilegge il modulo compilato. "classico" torna al percorso precedente.
      - key: QUADRA_WORD_MODO
        value: esperto
      - key: QUADRA_ESPERTO_MODELLO
        value: anthropic/claude-sonnet-5.5
      # PDF: "scrivi" compila anche caselle e campi incerti e li segna da
      # controllare (come la versione di settembre, che non chiedeva niente);
      # "chiedi" li lascia vuoti finche' chi compila non conferma.
      - key: QUADRA_PDF_CONFERME
        value: scrivi
      # Chi puo' entrare: "codice:Nome, codice:Nome". Senza questa, l'app
      # su un server si rifiuta di aprirsi - e' la protezione contro la
      # dimenticanza, non contro l'attacco.
      - key: CLIENTI
        sync: false
      # Il giorno in cui la prova finisce, in formato 2026-10-31. Si mette
      # adesso: una prova senza scadenza diventa un servizio acceso per
      # sempre che nessuno guarda piu'.
      - key: APP_SCADENZA
        sync: false
      # Dove scrivere. Adesso e' una cartella dentro il contenitore, che
      # sparisce a ogni riavvio; il giorno che si aggiunge il disco basta
      # montarlo qui e non cambia nient'altro.
      - key: QUADRA_DATI
        value: /app/dati
      # Senza disco quello che si scrive non sopravvive al
      # riavvio. L'app lo dice invece di lasciarlo scoprire.
      - key: DATI_VOLATILI
        value: "1"
